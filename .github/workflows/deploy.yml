name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test
        env:
          NEXT_PUBLIC_REPORIUM_API_URL: ${{ secrets.NEXT_PUBLIC_REPORIUM_API_URL }}

      - name: Generate library data (skip if fresh <24h)
        run: |
          LAST_COMMIT_TS=$(git log -1 --format="%ct" -- public/data/library.json 2>/dev/null || echo 0)
          NOW=$(date +%s)
          AGE=$(( NOW - LAST_COMMIT_TS ))
          if [ "$AGE" -lt 86400 ] && [ -f public/data/library.json ]; then
            echo "library.json last updated ${AGE}s ago (<24h) — skipping generate"
          else
            echo "library.json is stale (${AGE}s old) — running generate:resilient"
            npm run generate:resilient
          fi
        env:
          NEXT_PUBLIC_REPORIUM_API_URL: ${{ secrets.NEXT_PUBLIC_REPORIUM_API_URL }}
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Build static export
        run: npm run build
        env:
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          NEXT_PUBLIC_GITHUB_USERNAME: ${{ secrets.GH_USERNAME }}
          NEXT_PUBLIC_REPORIUM_API_URL: ${{ secrets.NEXT_PUBLIC_REPORIUM_API_URL }}
          NEXT_PUBLIC_APP_API_TOKEN: ${{ secrets.NEXT_PUBLIC_APP_API_TOKEN }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_BASE_PATH: /reporium

      - name: Verify out/data contents
        run: ls -la out/data/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
