name: Refresh Library Data

on:
  schedule:
    - cron: '0 6 * * *'    # Daily at 6am UTC  → quick run (Mon-Sat)
    - cron: '0 4 * * 0'    # Sunday at 4am UTC → weekly run (tier 2+3 refresh)
  workflow_dispatch:         # Manual trigger

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Full history needed for detect-trends
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Generate library data
        env:
          NEXT_PUBLIC_REPORIUM_API_URL: ${{ secrets.NEXT_PUBLIC_REPORIUM_API_URL }}
        run: |
          # fetch-library.ts: one API call to /library/full (~3s, no GitHub API rate limit cost)
          npm run generate
      - name: Fix builders
        run: npm run fix-builders
      - name: Validate library data
        run: npm run validate
      - name: Detect trends
        run: npm run detect-trends
      - name: Build gap analysis
        run: npm run gap-analysis
      - name: Generate digest
        run: npm run digest
      - name: Build FAQ answers
        env:
          # Server-only names (auth-hardening plan PR #7). The legacy
          # NEXT_PUBLIC_* secrets remain as fallbacks until the operator
          # creates the new Actions secrets, then they can be deleted.
          REPORIUM_API_URL: ${{ secrets.REPORIUM_API_URL }}
          REPORIUM_APP_TOKEN: ${{ secrets.REPORIUM_APP_TOKEN }}
          NEXT_PUBLIC_REPORIUM_API_URL: ${{ secrets.NEXT_PUBLIC_REPORIUM_API_URL }}
          NEXT_PUBLIC_APP_API_TOKEN: ${{ secrets.NEXT_PUBLIC_APP_API_TOKEN }}
        run: |
          # build-faq.ts: pre-computes /faq answers into public/data/faq.json so the
          # static page renders without per-visitor API calls. Paces at 11s/question
          # to stay under the /intelligence/ask 6/min-per-IP server limit.
          npm run build:faq
      - name: Regenerate sitemap
        run: |
          # KAN-123: regen public/sitemap.xml against the freshly written
          # public/data/library.json so <lastmod> dates stay >= library.generatedAt
          # day. Without this, tests/stability.generated-artifacts.test.ts
          # 'sitemap lastmod dates are not older than the library generation
          # date' goes red on every PR until the next manual sitemap regen.
          # generate-sitemap.ts re-runs the centralized privacy filter as
          # defense-in-depth (scripts/lib/sitemap.ts -> filterPrivateRepos).
          npm run sitemap
      - name: Commit updated data
        run: |
          set -e
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/data/library.json public/data/trends.json public/data/faq.json public/sitemap.xml DIGEST.md
          if ! git commit -m "chore: refresh library data $(date -u +%Y-%m-%d)"; then
            echo "No changes to commit"
            exit 0
          fi
          # The build:faq step takes ~18 minutes for 100 questions; in that window,
          # other PRs to main can land and make our local main stale. Rebase + retry
          # the push a few times so a concurrent merge doesn't discard the freshly
          # built artifacts. Run 25200173112 lost a 30+ min refresh to this race.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "push succeeded on attempt $attempt"
              exit 0
            fi
            echo "push attempt $attempt rejected (likely concurrent merge); rebasing and retrying..."
            git fetch origin main
            git rebase origin/main
            sleep 5
          done
          echo "::error::push failed after 5 rebase+retry attempts; abandoning to avoid loops"
          exit 1
