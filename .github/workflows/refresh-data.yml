name: Refresh Library Data

on:
  schedule:
    - cron: '0 6 * * *'    # Daily at 6am UTC  → quick run (Mon-Sat)
    - cron: '0 4 * * 0'    # Sunday at 4am UTC → weekly run (tier 2+3 refresh)
  workflow_dispatch:         # Manual trigger

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Full history needed for detect-trends
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Generate library data
        env:
          NEXT_PUBLIC_REPORIUM_API_URL: ${{ secrets.NEXT_PUBLIC_REPORIUM_API_URL }}
        run: |
          # fetch-library.ts: one API call to /library/full (~3s, no GitHub API rate limit cost)
          npm run generate
      - name: Fix builders
        run: npm run fix-builders
      - name: Validate library data
        run: npm run validate
      - name: Detect trends
        run: npm run detect-trends
      - name: Build gap analysis
        run: npm run gap-analysis
      - name: Generate digest
        run: npm run digest
      - name: Build FAQ answers
        env:
          NEXT_PUBLIC_REPORIUM_API_URL: ${{ secrets.NEXT_PUBLIC_REPORIUM_API_URL }}
          NEXT_PUBLIC_APP_API_TOKEN: ${{ secrets.NEXT_PUBLIC_APP_API_TOKEN }}
        run: |
          # build-faq.ts: pre-computes /faq answers into public/data/faq.json so the
          # static page renders without per-visitor API calls. Paces at 11s/question
          # to stay under the /intelligence/ask 6/min-per-IP server limit.
          npm run build:faq
      - name: Commit updated data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/data/library.json public/data/trends.json public/data/faq.json DIGEST.md
          git commit -m "chore: refresh library data $(date -u +%Y-%m-%d)" || echo "No changes to commit"
          git push
